apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-notes-hpa
  namespace: django-notes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-notes

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
